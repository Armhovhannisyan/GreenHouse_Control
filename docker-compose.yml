# Full stack: InfluxDB 2 + Node backend (REST API + static greenhouse UI).
#
# Start:  docker compose up --build -d
# Logs:   docker compose logs -f backend
# Stop:   docker compose down
#
# App:     http://localhost:3001/
# Influx:  http://localhost:8086  (admin / INFLUX_ADMIN_PASSWORD from docker.env.example)
# Grafana: http://localhost:3333/ (admin / GRAFANA_ADMIN_PASSWORD) — datasource Influx pre-provisioned
#
# backend/.env is loaded into the backend container. Compose overrides INFLUX_URL so the
# backend reaches Influx on the Docker network (not localhost).
services:
  influxdb:
    image: influxdb:2.7
    container_name: greenhouse-influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb2-data:/var/lib/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_ADMIN_PASSWORD:-greenctrl-influx-local}
      DOCKER_INFLUXDB_INIT_ORG: greenctrl
      DOCKER_INFLUXDB_INIT_BUCKET: greenhouse
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_ADMIN_TOKEN:-greenctrl-local-influx-token-replace-for-prod}
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: greenhouse-grafana
    ports:
      - "3333:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-greenctrl-grafana-local}
      GF_USERS_DEFAULT_THEME: dark
      GF_SERVER_ROOT_URL: http://localhost:3333
      # Iframe embed from greenhouse UI (Precision Growing). Do not expose :3333 on public Internet with this on.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # Anonymous Viewer lets iframe load without a separate Grafana login (different port = different cookies).
      # Set GRAFANA_EMBED_ANONYMOUS=false in root `.env` to disable (embed may be blank until you sign in to Grafana).
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_EMBED_ANONYMOUS:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Used by provisioning/datasources/influx.yaml (${INFLUX_TOKEN} expansion)
      INFLUX_TOKEN: ${INFLUX_ADMIN_TOKEN:-greenctrl-local-influx-token-replace-for-prod}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/dashboards
    depends_on:
      - influxdb
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: greenhouse-dashboard-backend:local
    container_name: greenhouse-backend
    ports:
      - "3001:3001"
    env_file:
      - backend/.env
    environment:
      NODE_ENV: production
      INFLUX_URL: http://influxdb:8086
    volumes:
      - ./db:/app/db
      - ./logs:/app/logs
    depends_on:
      - influxdb
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:3001/api/health',r=>{let d='';r.on('data',c=>d+=c);r.on('end',()=>process.exit(r.statusCode===200?0:1));}).on('error',()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  influxdb2-data:
  grafana-data:
